<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#FFFFFF"/>
  
  <!-- Rosette — SAME SIZE AS ORIGINAL, positioned for balance with clear space below -->
  <g transform="translate(540, 420)">
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(0)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(45)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(90)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(135)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(180)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(225)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(270)"/>
    <ellipse cx="0" cy="-140" rx="60" ry="97" fill="#81C784" opacity="0.65" transform="rotate(315)"/>
    <ellipse cx="0" cy="-75" rx="43" ry="70" fill="#4CAF50" opacity="0.80" transform="rotate(0)"/>
    <ellipse cx="0" cy="-75" rx="43" ry="70" fill="#4CAF50" opacity="0.80" transform="rotate(90)"/>
    <ellipse cx="0" cy="-75" rx="43" ry="70" fill="#4CAF50" opacity="0.80" transform="rotate(180)"/>
    <ellipse cx="0" cy="-75" rx="43" ry="70" fill="#4CAF50" opacity="0.80" transform="rotate(270)"/>
    <circle cx="0" cy="0" r="48" fill="#FBC02D"/>
  </g>
  
  <!-- Rosette bottom edge is at y ≈ 620. Text starts at y=820 → 200px clear space -->
  <!-- This follows professional clear space guidelines (more than gold center diameter) -->
  
  <text x="540" y="820" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="bold" fill="#2E7D32" text-anchor="middle" letter-spacing="3">Zman Greens</text>
  
  <line x1="410" y1="860" x2="670" y2="860" stroke="#FBC02D" stroke-width="3"/>
  
  <text x="540" y="905" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#81C784" text-anchor="middle" letter-spacing="14">JORDAN</text>
</svg>